version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: session_redis
    ports:
      - "6379:6379"
    volumes:
      - session_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

volumes:
  session_data:
    driver: local

networks:
  app-network:
    driver: bridge